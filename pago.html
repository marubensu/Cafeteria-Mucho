<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Pago · MUCHO</title>
  <meta name="description" content="Completá tus datos, la entrega y el medio de pago.">
  <link rel="icon" type="image/png" href="assets/img/logos/logo-mucho-cafe.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow+Semi+Condensed:ital,wght@0,400;0,500;0,600;1,400&family=Yellowtail&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=20261119q">
</head>
<body class="pagina-checkout" data-checkout="pago">
  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <header class="header">
    <div class="contenedor header__barra">
      <a class="header__logo" href="index.html" aria-label="MUCHO, ir al inicio">
        <img src="assets/img/logos/logo-mucho-cafe.png" alt="MUCHO" width="68" height="44">
      </a>
      <nav class="header__nav" id="nav-principal" aria-label="Principal">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a class="nav-menu" href="menu.html">Menú</a></li>
          <li><a href="el-lugar.html">El lugar</a></li>
          <li><a href="tienda.html" aria-current="page">Tienda</a></li>
          <li><a href="contacto.html">Contacto</a></li>
        </ul>
      </nav>
      <div class="header__acciones">
        <a class="estado" href="el-lugar.html#horarios" data-estado="largo"><span class="estado__texto">Lunes a viernes 8 a 20 h</span></a>
        <button class="header__toggle" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="nav-principal">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main id="contenido" class="contenedor checkout">
    <div id="checkout-pasos"></div>
    <div class="checkout-columnas">
      <form class="checkout-principal pago-form" id="pago-form" novalidate aria-labelledby="titulo-pago">
        <h1 class="checkout-titulo" id="titulo-pago">Pago</h1>

        <section class="pago-paso" aria-labelledby="pago-paso-1">
          <div class="pago-paso__cabecera"><span class="pago-paso__numero">01</span><h2 class="pago-paso__titulo" id="pago-paso-1">Tus datos</h2></div>
          <div id="pago-datos"></div>
        </section>

        <section class="pago-paso" aria-labelledby="pago-paso-2">
          <div class="pago-paso__cabecera"><span class="pago-paso__numero">02</span><h2 class="pago-paso__titulo" id="pago-paso-2">Entrega</h2></div>
          <div id="pago-entrega"></div>
        </section>

        <section class="pago-paso" aria-labelledby="pago-paso-3">
          <div class="pago-paso__cabecera"><span class="pago-paso__numero">03</span><h2 class="pago-paso__titulo" id="pago-paso-3">Medio de pago</h2></div>
          <div id="pago-medio"></div>
        </section>
      </form>
      <aside class="checkout-panel" id="pago-panel" aria-label="Resumen del pedido"></aside>
    </div>

    <!-- Mobile: botón de pago siempre a mano -->
    <div class="pago-barra-movil"><button type="button" class="btn btn--primario btn--ancho" id="pago-boton-movil">Pagar</button></div>

    <div class="carga" id="pago-carga" hidden role="status" aria-live="polite">
      <span class="visualmente-oculto">Procesando tu pedido</span>
      <svg class="carga__dibujo" viewBox="0 0 360 300" aria-hidden="true">
        <defs>
          <clipPath id="carga-taza"><path d="M196 204 H295 L284 260 Q281 273 268 273 H223 Q210 273 207 260 Z"/></clipPath>
        </defs>
        <text class="carga__texto" x="40" y="60">CARGANDO<tspan class="carga__punto">.</tspan><tspan class="carga__punto">.</tspan><tspan class="carga__punto">.</tspan></text>
        <rect class="carga__marco" x="40" y="78" width="280" height="26" rx="13"/>
        <rect class="carga__barra" x="47" y="85" width="201" height="12" rx="6"/>
        <path class="carga__chorro" d="M240 91 Q248 91 248 100 V128 Q248 134 244.5 134 Q241 134 241 128 V99 Z"/>
        <ellipse class="carga__gota carga__gota--1" cx="244.5" cy="150" rx="4.6" ry="6.4"/>
        <ellipse class="carga__gota carga__gota--2" cx="244.5" cy="150" rx="4.6" ry="6.4"/>
        <g clip-path="url(#carga-taza)"><rect class="carga__cafe" x="190" y="204" width="112" height="72"/></g>
        <path class="carga__taza" d="M196 204 H295 L284 260 Q281 273 268 273 H223 Q210 273 207 260 Z"/>
        <path class="carga__taza" d="M200 218 Q176 216 178 236 Q180 255 205 251"/>
        <path class="carga__taza" d="M196 204 Q245 213 295 204"/>
      </svg>
    </div>
  </main>

  <script src="js/data.js?v=20261119q"></script>
  <script src="js/main.js?v=20261119q"></script>
  <script src="js/pedido.js?v=20261119q"></script>
  <script src="js/checkout.js?v=20261119q"></script>
</body>
</html>
